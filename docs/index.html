    <!-- ─── SPA redirect handler for GitHub Pages ───
    On first load from 404.html, the original URL is stored in sessionStorage
    and the user is redirected here. This script restores the real URL before
    React mounts so the router picks it up correctly. -->
    <script>
      (function() {
        var redirect = sessionStorage.getItem('gh-pages-spa');
        if (redirect) {
          sessionStorage.removeItem('gh-pages-spa');
          if (redirect !== location.href) {
            history.replaceState(null, '', redirect);
          }
        }
      })();
    </script>
