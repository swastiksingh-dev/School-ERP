# ─── GitHub Actions: Deploy School-ERP to GitHub Pages ───
# Pushes the production build to gh-pages branch whenever main is updated.
# The app is then accessible at:
#   https://swastiksingh-dev.github.io/School-ERP/
#
# To enable: Repo Settings → Pages → Source: "Deploy from a branch"
#   → Branch: gh-pages / (root)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run build

      # ─── SPA fix: 404.html stores the requested URL in sessionStorage
      # and redirects to index.html, which restores the URL before React mounts.
      - run: |
          cat > dist/404.html << 'EOF'
          <!doctype html>
          <html>
          <head><meta charset="utf-8"><title>Redirecting…</title></head>
          <body>
            <script>
              sessionStorage.setItem('gh-pages-spa', location.href);
              location.replace('/School-ERP/');
            </script>
          </body>
          </html>
          EOF

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
