# ─── GitHub Actions: Deploy School-ERP to GitHub Pages ───
# Pushes the production build to gh-pages branch whenever main is updated.
# The app is then accessible at:
#   https://swastiksingh-dev.github.io/School-ERP/
#
# To enable: Repo Settings → Pages → Source: "Deploy from a branch"
#   → Branch: gh-pages / (root)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
